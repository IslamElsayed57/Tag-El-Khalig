services:
  - type: web
    name: taj-el-khalig
    runtime: node
    plan: starter
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TAJ_DATA_DIR
        value: /var/data
      - key: TAJ_ADMIN_USER
        sync: false
      - key: TAJ_ADMIN_PASSWORD
        sync: false
    disk:
      name: taj-el-khalig-data
      mountPath: /var/data
      sizeGB: 1
